<!DOCTYPE html>
<html lang="pt-br">
<head>

<body class="bg-light m-0 p-0">
<div id="conteudo-painel" class="d-flex flex-column align-items-center vh-100">
  <nav class="navbar navbar-expand-lg navbar-light bg-body-secondary w-100 px-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Ótica Visão</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-4 fw-bold">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Painel</a>
                    </li>

                    <li class="nav-item">
                        <a onclick="fazerLogout()"class="nav-link text-danger" href="login.html">Sair</a>
                    </li>
                </ul>
                <form id="formBusca" class="d-flex ms-auto" role="search">
                    <!-- Filtro por Tipo -->
                    <select id="filtroTipo" class="form-select form-select-sm" style="width: auto;">
                        <option value="">Todos os Tipos</option>
                        <option value="monofocal">Monofocal</option>
                        <option value="bifocal">Bifocal</option>
                        <option value="multifocal">Multifocal</option>
                    </select>
                    <input  id="buscarProduto" class="form-control form-control-sm me-2" type="search" placeholder="Código ou descrição..." aria-label="Search">           
                     <button class= "btn btn-success fw-bold" type="submit">Buscar</button>
            </form>
            </div>
        </div>
  </nav>
<div class="content-wrapper d-flex flex-column align-items-center w-100 mt-5">
    <h2 class="mt-4">Produtos</h2>
 <div class="container w-75 ">

   <table class="table table-bordered table-striped text-center align-middle">
    <tr >
    <th>id</th>
    <th>Código</th>
    <th>Descrição</th>
    <th>Tipo</th>
    <th>Indice_Refração</th>
    <th>Preço</th>
    <th>Estoque</th>
    <th>atualização em tempo real</th>
    <th> Editar | Excluir</th>

    </tr>
    <tbody id="body_table"></tbody>
  </table>

  <div class="d-flex justify-content-center gap-2 mt-4 ">
  <a href="cadastro.html" class="btn btn-success fw-bold">
    Cadastrar Novo Produto
  </a>
<button type="button"class="btn btn-danger fw-bold" onclick="carregarEstoqueBaixo()">⚠️ Estoque Crítico</button>
</div>
   
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
