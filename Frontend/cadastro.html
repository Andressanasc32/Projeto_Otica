<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Cadastrar Atividade</title>
</head>
<body class="bg-light m-0 p-0">

<div id="conteudo-painel" class="d-flex flex-column vh-100">
    
    <nav class="navbar navbar-expand-lg navbar-light bg-body-secondary w-100 px-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Ótica Visão</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-3">
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="painel.html">Painel</a>
                    
                </ul>
                <form class="d-flex ms-auto" role="search">
                    <input class="form-control me-2" type="search" placeholder="Pesquisar..." aria-label="Search">
                    <button class="btn btn-success fw-bold" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="content-wrapper d-flex flex-column align-items-center justify-content-center flex-grow-1 w-100 py-4">
        
        <div class="container w-50 bg-white p-4 rounded shadow-sm">
            <h2 class="text-center mb-4 text-dark fw-bold">Cadastrar Novo Produto</h2>
            
            <form id="formcadatividades">
            
                <div class="input-group input-group-sm mb-3">
                  <span class="input-group-text" id="inputGroup-sizing-sm">Código</span>
                  <input id="codigo" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm" placeholder="Ex: LEN-0001">
                </div>
                <div class="mb-3">
                    <label for="descricao" class="form-label fw-bold">Descrição</label>
                    <textarea id="descricao" class="form-control" id="descricao" rows="3" placeholder="Ex: Lente multifocal com tratamento antirreflexo avançado"></textarea>
                </div>
                <select id="tipo" class="form-select" aria-label="Default select example">
                        <option selected>Selecione o tipo de Lente</option>
                        <option value="multifocal">multifocal</option>
                        <option value="bifocal">Bifocal</option>
                        <option value="monofocal">Monofocal</option>
                </select>
                <div class="mb-3">
                    <label for="titulo" class="form-label fw-bold">Indice de Refração</label>
                    <input id="indice_refracao" type="text" class="form-control" id="titulo" placeholder="Ex: 1.50">
                </div>                
                <div class="input-group mb-3">
                <span class="input-group-text">$</span>
                <span class="input-group-text">Preço</span>
                <input id="preco" type="text" class="form-control" aria-label="Dollar amount (with dot and two decimal places)">
                </div>
                <div class="input-group input-group-sm mb-3">
                <span class="input-group-text" id="inputGroup-sizing-sm">Estoque</span>
                <input id="estoque" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm" placeholder="Ex: 40">
               </div>
                <div class="d-flex gap-2">
                    <button onclick="cadastrarProduto()"  type="submit" class="btn btn-success fw-bold">Salvar</button>
                    <a href="painel.html" class="btn btn-outline-danger fw-bold">Voltar</a>
                </div>
            </form>
        </div>

    </div> </div>

<script src="cadastro.js"></script>
</body>
</html>
